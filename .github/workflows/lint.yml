name: Lint code

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**"
      - "!**/*.md"
      - "!.github/**"
      - ".github/workflows/build.yml"
      - "!.vscode/**"
      - "!assets/**"
      - "!.gitignore"
      - "!**/*.nix"
      - "!**/flake.lock"

jobs:
  lint-qml:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm base-devel cmake ninja gcc clazy qt6-declarative qt6-shadertools python libpipewire aubio libqalculate git fish grep fftw iniparser alsa-lib meson
          git clone --depth 1 https://github.com/LukashonakV/cava.git /tmp/libcava
          meson setup /tmp/libcava /tmp/libcava/build -Dcava_font=false --prefix=/usr
          meson compile -C /tmp/libcava/build
          meson install -C /tmp/libcava/build

      - name: CMake build
        run: |
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clazy -DCMAKE_CXX_FLAGS=-Werror -DVERSION= -DGIT_REVISION=
          cmake --build build

      - name: Lint QML
        shell: fish {0}
        run: |
          /usr/lib/qt6/bin/qmllint --version
          set -l qml_files (string match -vr 'build/.*' **.qml)
          set -l lint_out (/usr/lib/qt6/bin/qmllint --import disable -I build/qml $qml_files 2>&1 | tee /dev/stderr) || true

  lint-cpp:
    runs-on: ubuntu-latest
    container:
        image: ghcr.io/axzoros/shell-arch-env:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: CMake build
        run: |
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DVERSION= -DGIT_REVISION=

      - name: Lint C++
        run: |
          clang-tidy --version
          run-clang-tidy -p build -quiet -j "$(nproc)" -warnings-as-errors='*' \
            -source-filter='^(?!.*/build/).*\.cpp$'
